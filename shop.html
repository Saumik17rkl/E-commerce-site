    <style>
        :root {
            --primary-color: #8B5E3C; /* Warm Wood Brown */
            --secondary-color: #f4efeb; /* Soft Beige */
            --dark-color: #2c2c2c;
            --light-bg: #f9f7f5;
            --text-gray: #7a7a7a;
            --white: #ffffff;
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
            --shadow-hover: 0 20px 40px rgba(139, 94, 60, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        h1, h2, h3, .logo {
            font-family: 'Playfair Display', serif;
        }

        body {
            width: 100%;
            background-color: #fdfdfd;
            color: var(--dark-color);
        }

        /* HEADER & NAVIGATION */
        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 80px;
            background: var(--white);
            box-shadow: 0 2px 20px rgba(0,0,0,0.03);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
        }

        #navbar {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #navbar li {
            list-style: none;
            padding: 0 20px;
            position: relative;
        }

        #navbar li a {
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            color: var(--dark-color);
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #navbar li a:hover,
        #navbar li a.active {
            color: var(--primary-color);
        }

        #navbar li a.active::after {
            content: "";
            width: 20px;
            height: 2px;
            background: var(--primary-color);
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
        }

        #mobile {
            display: none;
            align-items: center;
        }

        /* PAGE HEADER */
        #page-header {
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url("https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80");
            width: 100%;
            height: 50vh;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            text-align: center;
            flex-direction: column;
            padding: 14px;
            color: var(--white);
        }

        #page-header h2 {
            font-size: 56px;
            margin-bottom: 10px;
        }

        #page-header p {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* PRODUCT SECTION */
        #product1 {
            text-align: center;
            padding: 80px 10%;
        }

        #product1 h2 {
            font-size: 42px;
            margin-bottom: 10px;
            color: var(--dark-color);
        }

        #product1 p {
            color: var(--text-gray);
            margin-bottom: 60px;
            font-size: 18px;
        }

        .pro-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .pro {
            background: var(--white);
            padding: 0;
            border-radius: 0; /* Clean, architectural look */
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
            text-align: start;
            overflow: hidden;
        }

        .pro:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-10px);
        }

        .pro img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            transition: transform 0.8s ease;
        }

        .pro:hover img {
            transform: scale(1.05);
        }

        .pro .des {
            padding: 25px;
        }

        .pro .des h5 {
            font-size: 18px;
            margin: 10px 0 8px;
            color: var(--dark-color);
            font-weight: 600;
        }

        .pro .des .price {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
            margin: 12px 0;
            display: block;
        }

        .pro .cart-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
            width: 100%;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .pro .cart-btn:hover {
            background: #744a2b;
        }
        
        .pro .stock-tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }
        
        .pro .stock-in {
            background-color: #e6f7e6;
            color: #2e7d32;
        }
        
        .pro .stock-out {
            background-color: #ffebee;
            color: #c62828;
        }

        /* PAGINATION */
        #pagination {
            text-align: center;
            margin-top: 80px;
        }

        #pagination a {
            text-decoration: none;
            border: 1px solid var(--primary-color);
            padding: 12px 20px;
            color: var(--primary-color);
            font-weight: 500;
            margin: 0 5px;
            transition: var(--transition);
        }

        #pagination a:hover,
        #pagination a.active {
            background-color: var(--primary-color);
            color: var(--white);
        }

        /* LOADING */
        .spinner {
            border: 3px solid var(--secondary-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--primary-color);
            animation: spin 1s linear infinite;
            margin: 50px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }

                                ${product.stock}
                            </span>
                            <button class="cart-btn" ${product.stock === 'Out of Stock' ? 'disabled' : ''}>
                                <i class="fas fa-shopping-cart"></i>
                                ${product.stock === 'Out of Stock' ? 'Out of Stock' : 'Add to Cart'}
