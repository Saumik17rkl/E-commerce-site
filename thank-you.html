<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | BIZTAP Shopping Mart</title>

<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: #f9f9f9;
    margin: 0;
}

header {
    background: #088178;
    padding: 15px 60px;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header a {
    color: white;
    text-decoration: none;
    font-weight: 600;
}

.thank-you {
    text-align: center;
    padding: 100px 20px;
    background: white;
    max-width: 700px;
    margin: 60px auto;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.thank-you i {
    font-size: 80px;
    color: #4CAF50;
    margin-bottom: 20px;
}

.thank-you h1 {
    font-size: 36px;
    margin-bottom: 10px;
}

.thank-you p {
    font-size: 17px;
    color: #555;
    margin-bottom: 12px;
}

.order-id {
    font-weight: 700;
    color: #088178;
}

.offline {
    background: #fff3cd;
    color: #856404;
    padding: 12px;
    border-radius: 6px;
    margin-top: 20px;
}

.redirect {
    margin-top: 30px;
    font-size: 14px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <a href="index.html">BIZTAP Shopping Mart</a>
    <a href="index.html">Home</a>
</header>

<div class="thank-you">
    <i class="fas fa-check-circle"></i>
    <h1>Order Placed Successfully</h1>

    <p>Your order has been received.</p>
    <p>Order ID: <span class="order-id" id="order-id">—</span></p>

    <div id="offline-msg" class="offline" style="display:none;">
        ⚠️ Your order was saved offline and will be synced automatically when the backend is available.
    </div>

    <div class="redirect">
        You will be redirected to the home page in <strong id="countdown">10</strong> seconds.
    </div>
</div>

<script>
/* ---------- READ URL PARAMS ---------- */
const params = new URLSearchParams(window.location.search);
const orderId = params.get("order");
const isOffline = params.get("offline");

/* ---------- DISPLAY ORDER ID ---------- */
if (orderId) {
    document.getElementById("order-id").textContent = orderId;
}

/* ---------- OFFLINE MESSAGE ---------- */
if (isOffline === "true") {
    document.getElementById("offline-msg").style.display = "block";
}

/* ---------- RESET CART COUNT ---------- */
document.querySelectorAll('#cart-count, #mobile-cart-count').forEach(el => {
    if (el) el.textContent = "0";
});

/* ---------- AUTO REDIRECT (10s) ---------- */
let seconds = 10;
const counter = document.getElementById("countdown");

const timer = setInterval(() => {
    seconds--;
    counter.textContent = seconds;
    if (seconds === 0) {
        clearInterval(timer);
        window.location.href = "index.html";
    }
}, 1000);
</script>

</body>
</html>
