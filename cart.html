<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart – BIZTAP Shopping Mart</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

<style>
:root {
    --primary:#088178;
    --light:#f9f7f5;
    --dark:#2c2c2c;
}

* { box-sizing:border-box; margin:0; padding:0; font-family:Poppins,sans-serif; }
body { background:#fff; color:var(--dark); }

/* HEADER */
header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 5%;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
    position:sticky;
    top:0;
    background:#fff;
}

.logo { text-decoration:none; line-height:1; }
.logo-main { font-size:26px; font-weight:800; color:var(--primary); }
.logo-sub { font-size:12px; color:#666; }

nav ul { list-style:none; display:flex; gap:20px; }
nav a { text-decoration:none; color:#333; font-size:14px; }

/* HERO */
#page-header {
    height:35vh;
    background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
    url("https://images.unsplash.com/photo-1556906781-9a412961c28c");
    background-size:cover;
    background-position:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:#fff;
    text-align:center;
}

#page-header h2 { font-size:42px; }

/* CART */
#cart { padding:60px 5%; }

table { width:100%; border-collapse:collapse; }
th,td { padding:15px; border-bottom:1px solid #eee; }
th { background:var(--light); text-align:left; }

img { width:80px; border-radius:4px; }
input[type=number] { width:70px; padding:8px; }

.remove-btn {
    background:none;
    border:none;
    color:#ff4444;
    cursor:pointer;
}

/* TOTAL */
#cart-total {
    max-width:400px;
    margin-left:auto;
    margin-top:40px;
    background:var(--light);
    padding:30px;
    border-radius:6px;
}

.total-row {
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.checkout-btn {
    display:block;
    margin-top:20px;
    padding:14px;
    background:var(--primary);
    color:#fff;
    text-decoration:none;
    text-align:center;
    font-weight:600;
}

/* EMPTY */
.empty-cart {
    text-align:center;
    padding:80px 0;
}

.empty-cart i { font-size:60px; color:#ccc; }

.continue-shopping {
    display:inline-block;
    margin-top:20px;
    padding:12px 28px;
    background:var(--primary);
    color:#fff;
    text-decoration:none;
}

/* NOTIFICATION */
#notification {
    position:fixed;
    bottom:20px;
    right:20px;
    background:#4CAF50;
    color:#fff;
    padding:12px 20px;
    border-radius:4px;
    display:none;
}
</style>
</head>

<body>

<div id="notification">Updated</div>

<header>
    <a href="index.html" class="logo">
        <div class="logo-main">BIZTAP</div>
        <div class="logo-sub">Shopping Mart</div>
    </a>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a class="active" href="cart.html">Cart</a></li>
        </ul>
    </nav>
</header>

<section id="page-header">
    <h2>Your Cart</h2>
    <p>Review & confirm your order</p>
</section>

<section id="cart">
    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Subtotal</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="cart-items"></tbody>
    </table>

    <div id="cart-total">
        <h3>Cart Summary</h3>
        <div class="total-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
        <div class="total-row"><span>Tax (10%)</span><span id="tax">$0.00</span></div>
        <div class="total-row"><strong>Total</strong><strong id="total">$0.00</strong></div>
        <a href="checkout.html" class="checkout-btn">Proceed to Checkout</a>
    </div>
</section>

<!-- SINGLE SOURCE OF LOGIC -->
<script src="cart.js"></script>

</body>
</html>
