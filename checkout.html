<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | BIZTAP Shopping Mart</title>

<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f6f6f6;
    margin: 0;
}

#header {
    background: #088178;
    padding: 15px 60px;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#header a {
    color: white;
    text-decoration: none;
    font-weight: 600;
}

.checkout {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    padding: 40px 60px;
}

.checkout-form, .checkout-summary {
    background: white;
    padding: 30px;
    border-radius: 8px;
}

.checkout-form {
    flex: 2;
}

.checkout-summary {
    flex: 1;
    border: 1px solid #ddd;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
}

.form-group input, select, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
}

.form-row {
    display: flex;
    gap: 15px;
}

.btn-checkout {
    width: 100%;
    padding: 14px;
    background: #088178;
    color: white;
    border: none;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.btn-checkout:disabled {
    background: #999;
}

.order-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.order-total {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>

<header id="header">
    <a href="index.html">BIZTAP Shopping Mart</a>
    <a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart</a>
</header>

<div class="checkout">

<form id="checkout-form" class="checkout-form">
    <h3>Billing Details</h3>

    <div class="form-row">
        <div class="form-group">
            <label>First Name *</label>
            <input id="first-name" required>
        </div>
        <div class="form-group">
            <label>Last Name *</label>
            <input id="last-name" required>
        </div>
    </div>

    <div class="form-group">
        <label>Email *</label>
        <input type="email" id="email" required>
    </div>

    <div class="form-group">
        <label>Phone *</label>
        <input id="phone" required>
    </div>

    <div class="form-group">
        <label>Address *</label>
        <input id="street" required>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>City *</label>
            <input id="city" required>
        </div>
        <div class="form-group">
            <label>ZIP *</label>
            <input id="zip" required>
        </div>
    </div>

    <div class="form-group">
        <label>Order Notes</label>
        <textarea id="notes"></textarea>
    </div>
</form>

<div class="checkout-summary">
    <h3>Your Order</h3>
    <div id="order-summary"></div>
    <div class="order-total" id="order-total"></div>
    <button class="btn-checkout" id="place-order">Place Order</button>
</div>

</div>

<script>
function generateOrderId() {
    return "BIZTAP-ORD-" + Date.now();
}

function getCart() {
    return JSON.parse(localStorage.getItem("cart")) || [];
}

function saveOrder(order) {
    const orders = JSON.parse(localStorage.getItem("orders")) || [];
    orders.push(order);
    localStorage.setItem("orders", JSON.stringify(orders));
}

async function syncWithBackend(order) {
    try {
        const res = await fetch("http://127.0.0.1:8000/orders/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(order)
        });
        return res.ok;
    } catch {
        return false;
    }
}

/* ---------- INIT ---------- */
const cart = getCart();
if (!cart.length) location.href = "cart.html";

const summary = document.getElementById("order-summary");
const totalBox = document.getElementById("order-total");

let subtotal = 0;
summary.innerHTML = "";

cart.forEach(item => {
    subtotal += item.price * item.quantity;
    summary.innerHTML += `
        <div class="order-item">
            <span>${item.name} × ${item.quantity}</span>
            <span>$${(item.price * item.quantity).toFixed(2)}</span>
        </div>`;
});

totalBox.textContent = "Total: $" + subtotal.toFixed(2);

/* ---------- PLACE ORDER ---------- */
document.getElementById("place-order").addEventListener("click", async () => {
    const btn = document.getElementById("place-order");

    // Basic validation
    const firstName = document.getElementById("first-name").value.trim();
    const lastName  = document.getElementById("last-name").value.trim();
    const email     = document.getElementById("email").value.trim();
    const phone     = document.getElementById("phone").value.trim();
    const street    = document.getElementById("street").value.trim();
    const city      = document.getElementById("city").value.trim();
    const zip       = document.getElementById("zip").value.trim();

    if (!firstName || !lastName || !email || !phone || !street || !city || !zip) {
        alert("Please fill all required fields.");
        return;
    }

    btn.disabled = true;
    btn.textContent = "Placing Order...";

    const order = {
        id: generateOrderId(),
        createdAt: new Date().toISOString(),
        status: "PENDING_SYNC",
        customer: {
            firstName,
            lastName,
            email,
            phone,
            address: { street, city, zip }
        },
        items: cart,
        total: subtotal
    };

    // Try backend
    const synced = await syncWithBackend(order);
    order.status = synced ? "SYNCED" : "PENDING_SYNC";

    // Save ONCE
    saveOrder(order);

    // Clear cart
    localStorage.removeItem("cart");

    // Redirect
    window.location.href = synced
        ? `thank-you.html?order=${order.id}`
        : `thank-you.html?offline=true&order=${order.id}`;
});
</script>

</body>
</html>
